services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: rtx5070-fast-reasoning-yolo:latest
    working_dir: /workspace
    volumes:
      - .:/workspace
    stdin_open: true
    tty: true
    gpus: all
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
